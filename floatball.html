<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat Hub</title>
<style>
  * { box-sizing:border-box; }
  html, body { width:120px; height:120px; margin:0; overflow:hidden; background:transparent; user-select:none; }
  body { display:grid; place-items:center; font-family:system-ui, -apple-system, "Segoe UI", sans-serif; }
  .float-launcher {
    --float-color:#10a37f; --float-rgb:16, 163, 127;
    width:54px; height:54px; padding:0; border:0; border-radius:50%;
    display:grid; place-items:center; position:relative; cursor:grab; color:#fff;
    background:rgba(var(--float-rgb), var(--glass-alpha, .8));
    border:1px solid rgba(255,255,255,.3); backdrop-filter:blur(20px);
    box-shadow:0 8px 22px rgba(var(--float-rgb),.36), 0 2px 5px rgba(0,0,0,.16);
    transition:transform 160ms ease, box-shadow 160ms ease, opacity 180ms ease;
    -webkit-app-region:no-drag;
  }
  .float-launcher:hover { transform:scale(1.05); box-shadow:0 8px 24px rgba(var(--float-rgb),.42), 0 3px 8px rgba(0,0,0,.18); }
  .float-launcher:active, .float-launcher.is-dragging { cursor:grabbing; transform:scale(.94); }
  .float-launcher.is-hidden { opacity:0; pointer-events:none; }
  svg { width:23px; height:23px; position:relative; z-index:1; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .float-launcher { transition:none; } }
</style>
</head>
<body>
  <button class="float-launcher" id="float-launcher" aria-label="打开 AI Chat Hub" title="打开 AI Chat Hub">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2Zm0 14H6l-2 2V4h16v12Z"/>
    </svg>
  </button>
<script>
  (() => {
    const launcher = document.getElementById('float-launcher');
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;
    let pointerId = null;
    let dragged = false;

    function applyAccentColor(color) {
      if (!/^#[0-9a-f]{6}$/i.test(color)) return;
      const red = parseInt(color.slice(1, 3), 16);
      const green = parseInt(color.slice(3, 5), 16);
      const blue = parseInt(color.slice(5, 7), 16);
      launcher.style.setProperty('--float-color', color);
      launcher.style.setProperty('--float-rgb', `${red}, ${green}, ${blue}`);
    }

    launcher.addEventListener('contextmenu', event => {
      event.preventDefault();
      window.float.showContextMenu();
    });
    launcher.addEventListener('pointerdown', event => {
      pointerId = event.pointerId;
      startX = lastX = event.screenX;
      startY = lastY = event.screenY;
      dragged = false;
      launcher.setPointerCapture(pointerId);
      launcher.classList.add('is-dragging');
    });
    launcher.addEventListener('pointermove', event => {
      if (pointerId !== event.pointerId) return;
      const dx = event.screenX - lastX;
      const dy = event.screenY - lastY;
      lastX = event.screenX;
      lastY = event.screenY;
      if (Math.abs(event.screenX - startX) + Math.abs(event.screenY - startY) > 4) dragged = true;
      if (dragged && Number.isFinite(dx) && Number.isFinite(dy)) window.float.onDrag(dx, dy);
    });
    function finishPointer(event) {
      if (pointerId === null || (event && pointerId !== event.pointerId)) return;
      if (launcher.hasPointerCapture(pointerId)) launcher.releasePointerCapture(pointerId);
      launcher.classList.remove('is-dragging');
      pointerId = null;
      if (dragged) window.float.onDragEnd();
      else window.float.onClick();
    }
    launcher.addEventListener('pointerup', finishPointer);
    launcher.addEventListener('pointercancel', finishPointer);
    window.float.onFadeOut(() => launcher.classList.add('is-hidden'));
    window.float.onFadeIn(() => launcher.classList.remove('is-hidden'));
    window.float.onAccentChange(applyAccentColor);
    window.float.onGlassChange(value => {
      if (Number.isFinite(value)) launcher.style.setProperty('--glass-alpha', String(1 - Math.max(0, Math.min(70, value)) / 100));
    });
  })();
</script>
</body>
</html>

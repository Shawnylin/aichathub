<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新页面</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff; color:#333;
    user-select:none; -webkit-user-select:none;
    transition: background .2s, color .2s;
  }
  body.dark { background:#1f1f1f; color:#e0e0e0; }
  .logo { width:76px; height:76px; border-radius:20px; margin-bottom:30px; }
  .search {
    display:flex; align-items:center; gap:8px;
    width:min(520px, 80vw); height:46px; padding:0 18px;
    border:1.5px solid #e2e2e5; border-radius:24px;
    background:#f7f7f8;
    transition: border-color .15s, box-shadow .15s, background .2s;
  }
  body.dark .search { border-color:#3a3a3a; background:#2a2a2a; }
  .search:focus-within { border-color:#10a37f; box-shadow:0 0 0 3px rgba(16,163,127,.15); }
  .search svg { width:18px; height:18px; color:#9b9b9f; flex-shrink:0; }
  .search input {
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    font-size:14px; color:inherit; font-family:inherit;
  }
  .search input::placeholder { color:#9b9b9f; }
  .search .engine { font-size:11px; color:#9b9b9f; flex-shrink:0; }
  .hint { margin-top:14px; font-size:12px; color:#9b9b9f; }
  body.dark .hint { color:#777; }
</style>
</head>
<body>
  <img class="logo" src="svg/logo.svg" alt="AI Chat Hub">
  <div class="search">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="输入关键词，百度一下" autocomplete="off" spellcheck="false">
    <span class="engine">百度</span>
  </div>
  <div class="hint">输入关键词搜索，或直接输入网址</div>
  <script>
    // 跟随应用主题（?theme=dark）
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.body.classList.add('dark');
    }
    var input = document.getElementById('q');
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var q = input.value.trim();
        if (q) location.href = 'https://www.baidu.com/s?wd=' + encodeURIComponent(q);
      }
    });
    setTimeout(function() { input.focus(); }, 100);
  </script>
</body>
</html>

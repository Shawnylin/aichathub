<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新页面 · AI Chat Hub</title>
<link rel="stylesheet" href="renderer/grokbot-theme.css">
<link rel="stylesheet" href="renderer/start-page.css">
</head>
<body>
  <main class="start-page" aria-labelledby="start-title">
  <header class="start-header">
    <img class="logo" src="svg/grokbot-mark.svg" alt="" width="80" height="80">
    <p class="start-eyebrow">AI Chat Hub</p>
    <h1 id="start-title">从一个想法开始</h1>
    <p class="subtitle">搜索新知，打开网页，继续你的思路。</p>
  </header>
  <form class="start-card" id="search-form">
  <label class="search-label" for="q">搜索或打开网址</label>
  <div class="search">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="输入关键词或网址" autocomplete="off" spellcheck="false" aria-describedby="search-hint">
    <button type="submit" aria-label="搜索或打开">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </button>
  </div>
  <div class="search-meta">
    <p class="hint" id="search-hint">关键词使用百度搜索，网址将直接打开</p>
    <span class="keyboard-hint"><kbd>Enter</kbd> 打开</span>
  </div>
  </form>
  <footer class="start-footer">
    <span class="footer-line" aria-hidden="true"></span>
    <span>一个安静的起点</span>
    <span class="footer-line" aria-hidden="true"></span>
  </footer>
  </main>
  <script>
    // 跟随应用主题（?theme=dark）
    var params = new URLSearchParams(location.search);
    if (params.get('theme') === 'dark') {
      document.body.classList.add('dark');
    }
    var accent = params.get('accent');
    if (/^#[0-9a-f]{6}$/i.test(accent || '')) {
      document.documentElement.style.setProperty('--accent', accent);
    }
    var input = document.getElementById('q');
    document.getElementById('search-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var q = input.value.trim();
      if (!q) return;
      var target = /^https?:\/\//i.test(q) ? q : (/^(?:localhost|(?:[a-z0-9-]+\.)+[a-z]{2,})(?::\d+)?(?:[/?#]\S*)?$/i.test(q) ? 'https://' + q : null);
      location.href = target || 'https://www.baidu.com/s?wd=' + encodeURIComponent(q);
    });
    setTimeout(function() { input.focus(); }, 100);
  </script>
</body>
</html>
